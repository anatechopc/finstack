name: "SMS Gateway: Build & Test"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - 'feat/sms-gateway*'
    paths:
      - 'apps/sms-gateway/**'
      - '.github/workflows/sms-gateway.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/sms-gateway/**'
      - '.github/workflows/sms-gateway.yml'

defaults:
  run:
    working-directory: apps/sms-gateway

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create dummy google-services.json
        run: |
          mkdir -p app/src/debug app/src/release
          echo '{"project_info":{"project_number":"000000000000","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.loooans.smsgateway.dev"}},"api_key":[{"current_key":"dummy-key"}]}],"configuration_version":"1"}' > app/src/debug/google-services.json
          echo '{"project_info":{"project_number":"000000000000","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.loooans.smsgateway"}},"api_key":[{"current_key":"dummy-key"}]}],"configuration_version":"1"}' > app/src/release/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug
