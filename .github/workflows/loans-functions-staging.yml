name: "Loans Functions: Staging"

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
    paths:
      - 'functions/loans/**'
      - '.github/workflows/loans-functions-*.yml'
  pull_request:
    branches:
      - 'release/**'
    paths:
      - 'functions/loans/**'
      - '.github/workflows/loans-functions-*.yml'

defaults:
  run:
    working-directory: functions/loans

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # functions/loans is a multi-module Go setup wired together with `replace`
      # directives, so `./...` only reaches the module rooted here. Every sibling
      # module (api, job, test/fakes, triggers, types, utils) must be built and
      # tested explicitly — otherwise a module can stop compiling, or an internal
      # test can stop running, while CI stays green.
      #
      # Do not pipe the go commands: a pipeline exits with the status of its last
      # element, which would swallow every failure and make this step a no-op.
      - name: Build and test every module
        run: |
          set -uo pipefail
          status=0
          for mod in $(find . -name go.mod -not -path './vendor/*' -exec dirname {} \; | sort); do
            echo "::group::$mod"
            if ! (cd "$mod" && go build -v ./... && go test -v ./...); then
              echo "::error::module $mod failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: 'read'
      id-token: 'write'
    if: github.event_name == 'push'
    steps:
      - name: 'git checkout'
        uses: actions/checkout@v4
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/565409367468/locations/global/workloadIdentityPools/github-actions/providers/github-actions'
          service_account: 'github@loooans-dev-stg.iam.gserviceaccount.com'
      - id: 'setup_go'
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 390.0.0'
      - name: gcloud functions deploy
        run: '../../.github/scripts/deploy_functions.sh -e staging -p loooans-dev-stg'
        shell: bash
      - name: Deploy message
        run: echo 'Yahoo! deployed code to staging environment'
