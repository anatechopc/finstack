name: "Loans App: Development"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - 'apps/loans/**'
      - 'packages/**'
      - '.github/workflows/loans-app-*.yml'
  push:
    branches:
      - develop
    paths:
      - 'apps/loans/**'
      - 'packages/**'
      - '.github/workflows/loans-app-*.yml'

defaults:
  run:
    working-directory: apps/loans

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step to extract flutter version from .fvmrc
  get_flutter_version:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.extract_version.outputs.flutter_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract Flutter version from .fvmrc
        id: extract_version
        run: |
          version=$(grep '"flutter"' apps/loans/.fvmrc | sed 's/.*: *"\([^"]*\)".*/\1/' | cut -d'@' -f1)
          echo "flutter_version=$version" >> $GITHUB_OUTPUT
        working-directory: .

  # Job that runs on PR. To test. Check result of the job
  build_and_preview:
    needs: get_flutter_version
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      checks: write
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.get_flutter_version.outputs.flutter_version }}

      - name: Get package dependencies
        run: |
          for group in core loans; do
            for pkg in ../../packages/$group/*/; do
              (cd "$pkg" && flutter pub get)
            done
          done

      - name: Restore generated code cache
        uses: actions/cache@v4
        with:
          path: /tmp/codegen-cache
          key: codegen-${{ github.run_id }}
          restore-keys: codegen-

      - name: Generate code
        run: |
          mkdir -p /tmp/codegen-cache
          rm -f /tmp/rebuild-list.txt

          for group in core loans; do
            for pkg in ../../packages/$group/*/; do
              if ! grep -q build_runner "$pkg/pubspec.yaml"; then
                continue
              fi

              pkg_name=$(basename "$pkg")
              pkg_group=$(basename "$(dirname "$pkg")")
              cache_key="${pkg_group}_${pkg_name}"

              # Hash ALL package sources (not just this package's) so a change
              # to a shared package (e.g. loooans_helpers, whose converters are
              # inlined into dependents' generated code) invalidates their
              # cached codegen. Previously a shared-helper change left
              # dependents serving outdated *.g.dart from cache.
              current_hash=$( (cat "$pkg/pubspec.yaml"; find ../../packages -path '*/lib/*' -name '*.dart' ! -name '*.g.dart' -type f | sort | xargs cat) | sha256sum | cut -d' ' -f1)

              cached_hash=""
              if [ -f "/tmp/codegen-cache/${cache_key}.hash" ]; then
                cached_hash=$(cat "/tmp/codegen-cache/${cache_key}.hash")
              fi

              if [ "$current_hash" = "$cached_hash" ] && [ -f "/tmp/codegen-cache/${cache_key}.tar.gz" ]; then
                echo "[cached] $pkg_group/$pkg_name"
                tar xzf "/tmp/codegen-cache/${cache_key}.tar.gz" -C "$pkg"
              else
                echo "[build]  $pkg_group/$pkg_name"
                echo "$pkg|$cache_key|$current_hash" >> /tmp/rebuild-list.txt
              fi
            done
          done

          if [ -f /tmp/rebuild-list.txt ] && [ -s /tmp/rebuild-list.txt ]; then
            echo ""
            echo "Rebuilding $(wc -l < /tmp/rebuild-list.txt | tr -d ' ') package(s)..."
            cut -d'|' -f1 /tmp/rebuild-list.txt | xargs -P 4 -I {} bash -c 'cd "{}" && dart run build_runner build --delete-conflicting-outputs'

            while IFS='|' read -r pkg cache_key current_hash; do
              (cd "$pkg" && find lib -name '*.g.dart' -print0 | tar czf "/tmp/codegen-cache/${cache_key}.tar.gz" --null -T -)
              echo "$current_hash" > "/tmp/codegen-cache/${cache_key}.hash"
            done < /tmp/rebuild-list.txt
          else
            echo ""
            echo "All packages restored from cache"
          fi

      # Gate the PR on the unit tests. Until this existed, no workflow ran
      # `flutter test` at all: a PR could go green with failing or entirely
      # unexecuted tests, which is how a bloc regression could ship unnoticed.
      #
      # SKIPPED_PACKAGES already fail on develop and are excluded so this gate
      # can exist at all. They are reported as warnings on every run rather
      # than skipped silently — an exclusion nobody can see reads as coverage.
      #   address_repository, bank_details_repository — scaffold tests
      #     instantiate a repository, which builds FirebaseFirestore.instance
      #     and throws [core/no-app]; they cannot pass without a Firebase stub.
      #   review_repository — two genuine JSON round-trip failures (response
      #     fields lost, snake_case keys missing); a real bug, not a harness
      #     problem, and worth its own fix.
      # Shrink this list; do not grow it.
      - name: Run package tests
        env:
          SKIPPED_PACKAGES: 'address_repository bank_details_repository review_repository'
        run: |
          failed=''
          for group in core loans; do
            for pkg in ../../packages/$group/*/; do
              name=$(basename "$pkg")
              [ -d "$pkg/test" ] || continue
              case " $SKIPPED_PACKAGES " in
                *" $name "*)
                  echo "::warning title=Package tests skipped::$name is excluded because its tests already fail on develop"
                  continue
                  ;;
              esac
              echo "::group::$name"
              (cd "$pkg" && flutter test) || failed="$failed $name"
              echo "::endgroup::"
            done
          done
          if [ -n "$failed" ]; then
            echo "::error title=Package tests failed::$failed"
            exit 1
          fi

      - name: Run app tests
        run: flutter test

      - name: Build web
        run: flutter build web -t lib/main_development.dart --release
          --dart-define=ENVIRONMENT=development --output build/web/development

      # Run the Firebase deploy tooling on Node 24 (Node 20 is deprecated).
      - name: Set up Node for Firebase tooling
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          # Disable Node 20+ Happy-Eyeballs (autoSelectFamily) IPv6/IPv4 racing,
          # the cause of "Premature close" on keep-alive connections to googleapis.
          # firebase-tools recovers every call except the non-idempotent release
          # POST, which then false-400s ("is the current active version").
          NODE_OPTIONS: --no-network-family-autoselection
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOOOANS_DEV_STG }}
          projectId: loooans-dev-stg
          target: develop
          entryPoint: apps/loans

  # Job that runs on merge to 'develop'
  update-version-on-merge:
    needs: get_flutter_version
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.get_flutter_version.outputs.flutter_version }}

      - name: Get current version
        id: get_version
        run: |
          current_version=$(grep 'version:' pubspec.yaml | sed 's/version: //')
          echo "current_version=$current_version" >> $GITHUB_OUTPUT

      - name: Bump version (patch) and set pre-release if needed
        id: bump_version
        if: "!contains(github.event.head_commit.message, 'chore(version): bump to')"
        run: |
          chmod +x scripts/bump_version.sh
          ./scripts/bump_version.sh
          new_version=$(grep 'version:' pubspec.yaml | sed 's/version: //')
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        if: steps.bump_version.conclusion == 'success'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml
          git commit -m "chore(version): bump to ${{ steps.bump_version.outputs.new_version }}"
          git push

  deploy_to_development:
    permissions:
      contents: read
      deployments: write
    needs: [ update-version-on-merge, get_flutter_version ]
    if: |
      always() &&
      (needs.get_flutter_version.result == 'success') &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.get_flutter_version.outputs.flutter_version }}

      - name: Get package dependencies
        run: |
          for group in core loans; do
            for pkg in ../../packages/$group/*/; do
              (cd "$pkg" && flutter pub get)
            done
          done

      - name: Restore generated code cache
        uses: actions/cache@v4
        with:
          path: /tmp/codegen-cache
          key: codegen-${{ github.run_id }}
          restore-keys: codegen-

      - name: Generate code
        run: |
          mkdir -p /tmp/codegen-cache
          rm -f /tmp/rebuild-list.txt

          for group in core loans; do
            for pkg in ../../packages/$group/*/; do
              if ! grep -q build_runner "$pkg/pubspec.yaml"; then
                continue
              fi

              pkg_name=$(basename "$pkg")
              pkg_group=$(basename "$(dirname "$pkg")")
              cache_key="${pkg_group}_${pkg_name}"

              # Hash ALL package sources (not just this package's) so a change
              # to a shared package (e.g. loooans_helpers, whose converters are
              # inlined into dependents' generated code) invalidates their
              # cached codegen. Previously a shared-helper change left
              # dependents serving outdated *.g.dart from cache.
              current_hash=$( (cat "$pkg/pubspec.yaml"; find ../../packages -path '*/lib/*' -name '*.dart' ! -name '*.g.dart' -type f | sort | xargs cat) | sha256sum | cut -d' ' -f1)

              cached_hash=""
              if [ -f "/tmp/codegen-cache/${cache_key}.hash" ]; then
                cached_hash=$(cat "/tmp/codegen-cache/${cache_key}.hash")
              fi

              if [ "$current_hash" = "$cached_hash" ] && [ -f "/tmp/codegen-cache/${cache_key}.tar.gz" ]; then
                echo "[cached] $pkg_group/$pkg_name"
                tar xzf "/tmp/codegen-cache/${cache_key}.tar.gz" -C "$pkg"
              else
                echo "[build]  $pkg_group/$pkg_name"
                echo "$pkg|$cache_key|$current_hash" >> /tmp/rebuild-list.txt
              fi
            done
          done

          if [ -f /tmp/rebuild-list.txt ] && [ -s /tmp/rebuild-list.txt ]; then
            echo ""
            echo "Rebuilding $(wc -l < /tmp/rebuild-list.txt | tr -d ' ') package(s)..."
            cut -d'|' -f1 /tmp/rebuild-list.txt | xargs -P 4 -I {} bash -c 'cd "{}" && dart run build_runner build --delete-conflicting-outputs'

            while IFS='|' read -r pkg cache_key current_hash; do
              (cd "$pkg" && find lib -name '*.g.dart' -print0 | tar czf "/tmp/codegen-cache/${cache_key}.tar.gz" --null -T -)
              echo "$current_hash" > "/tmp/codegen-cache/${cache_key}.hash"
            done < /tmp/rebuild-list.txt
          else
            echo ""
            echo "All packages restored from cache"
          fi

      - name: Build Web
        run: flutter build web -t lib/main_development.dart --release --dart-define=ENVIRONMENT=development --output build/web/development

      # Run the Firebase deploy tooling on Node 24 (Node 20 is deprecated).
      - name: Set up Node for Firebase tooling
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          # Disable Node 20+ Happy-Eyeballs (autoSelectFamily) IPv6/IPv4 racing,
          # the cause of "Premature close" on keep-alive connections to googleapis.
          # firebase-tools recovers every call except the non-idempotent release
          # POST, which then false-400s ("is the current active version").
          NODE_OPTIONS: --no-network-family-autoselection
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LOOOANS_DEV_STG }}
          channelId: live
          projectId: loooans-dev-stg
          target: develop
          entryPoint: apps/loans
