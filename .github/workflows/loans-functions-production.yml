name: "Loans Functions: Production"

on:
  push:
    branches:
      - master
    paths:
      - 'functions/loans/**'
      - '.github/workflows/loans-functions-*.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'functions/loans/**'
      - '.github/workflows/loans-functions-*.yml'

defaults:
  run:
    working-directory: functions/loans

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: 'read'
      id-token: 'write'
    if: github.event_name == 'push'
    steps:
      - name: 'git checkout'
        uses: actions/checkout@v4
      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/444559784514/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github@loooans-prod.iam.gserviceaccount.com'
      - id: 'setup_go'
        name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 390.0.0'
      - name: gcloud functions deploy
        run: '../../.github/scripts/deploy_functions.sh -e production -p loooans-prod'
        shell: bash
      - name: Deploy message
        run: echo 'Yahoo! deployed code to production environment'
